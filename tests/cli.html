<!doctype html>
<div id="root"></div><output></output><img hidden src="/test-pending" alt="">
<script type="module">
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (url, options) => url === '/api/session'
    ? Promise.resolve(Response.json({user:'test', canManageApps:false, canChooseSandbox:true})) : nativeFetch(url, options);
  const workspace = {id:'~',parentId:null,type:'workspace',name:'Workspace'};
  const profile = {id:'profile-demo',parentId:'~',type:'profile',name:'Demo'};
  const twin = {...profile,id:'profile-twin'};
  const catalog = {
    inspect:{type:'cli',version:'1',description:'Inspect this profile',doc:'Choose a supported inspection mode.',schema:{input:{type:'object',properties:{args:{type:'array',items:{enum:['valid']}},env:{type:'object',additionalProperties:{type:'string'}}},additionalProperties:false}}},
    report:{type:'cli',version:'1',description:'Print report',schema:{input:{type:'object',additionalProperties:false}}}
  };
  let confirms = 0, accept = false;
  window.confirm = () => { confirms++; return accept; };
  const sockets = [];
  class Socket {
    static OPEN = 1;
    readyState = 0;
    constructor(url) {
      this.terminal = String(url).includes('/api/ws/terminal');
      if (this.terminal) sockets.push(this);
      queueMicrotask(() => { this.readyState = 1; this.onopen?.(); });
    }
    send(raw) {
      if (typeof raw !== 'string') return;
      const msg = JSON.parse(raw);
      if (this.terminal) {
        if (msg.argv || msg.cli) this.request = msg;
        return;
      }
      const result = msg.method === 'discover' ? [workspace,profile,twin] : msg.method === 'help' && [profile.id,twin.id].includes(msg.params.node) ? catalog : {};
      queueMicrotask(() => this.emit({jsonrpc:'2.0', id:msg.id, result}));
    }
    emit(msg) {this.onmessage?.({data:JSON.stringify(msg)});}
    close() {this.readyState = 3;}
  }
  window.WebSocket = Socket;
  const el = selector => document.querySelector(selector);
  const all = selector => [...document.querySelectorAll(selector)];
  function assert(ok, message) {if (!ok) throw Error(message);}
  async function wait(check, message) {
    for(let i=0; i<300; i++) {
      const result = check(); if (result) return result;
      await new Promise(resolve => setTimeout(resolve,15));
    }
    throw Error('Timeout: ' + message);
  }
  const motion = matchMedia('(prefers-reduced-motion: no-preference)').matches;
  async function checkWidthTransition(item, fullWidth) {
    const transition = await wait(() => item.getAnimations().find(a => a.transitionProperty === 'width'), 'width transition');
    transition.pause();
    transition.currentTime = transition.effect.getTiming().duration / 2;
    const width = item.getBoundingClientRect().width;
    assert(width > 0 && width < fullWidth, 'tab strip has an intermediate width');
    transition.finish();
  }
  const click = async selector => (await wait(() => el(selector),selector)).click();
  function fill(selector, value) {
    const node = el(selector);
    Object.getOwnPropertyDescriptor(node instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype,'value').set.call(node,value);
    node.dispatchEvent(new Event('input',{bubbles:true}));
  }
  const active = () => el('.terminal-frame:not([hidden]) .xterm');
  const selection = id => el('[data-terminal="'+id+'"][aria-selected=true]');
  async function launch(id) {
    await click('#start-terminal');
    await wait(() => sockets[id-1]?.request && selection(id),'session '+id);
  }
  const reducedTest = location.search === '?reduced';
  try {
    if (reducedTest) assert(!motion, 'browser emulates reduced motion');
    history.replaceState(null,'','/nodes/profile-demo');
    await import('../src/panel/main.tsx');
    await click('[data-cli-method=inspect]');
    await wait(() => el('#terminal-command'),'CLI form');
    assert(!el('#terminal-sandbox') && el('.cli-launch-context').textContent.includes(profile.id),'action context');
    await click('#terminal-launch form .cli-reference > summary');
    await click('#terminal-launch #schema-block > summary');
    assert(el('#terminal-launch form #feature-doc').textContent === catalog.inspect.doc
      && JSON.parse(el('#terminal-launch #feature-schema').textContent).input.type === 'object', 'launcher documentation and schema');
    assert(el('#start-terminal').textContent === 'Run','CLI submit label');
    fill('#terminal-command','invalid');
    await wait(() => el('#start-terminal').disabled && el('#terminal-command[aria-invalid=true]'),'invalid schema');
    assert(sockets.length===0, 'invalid action opened a socket');
    await click('#terminal-arguments-mode');
    await wait(() => el('[aria-label="Argument 0"][aria-invalid=true]'),'invalid structured row');
    fill('[aria-label="Argument 0"]','valid');
    await click('.launch-environment summary');
    await click('.launch-environment .launch-rows > button');
    await wait(() => el('[aria-label="Environment name 1"]'),'env');
    fill('[aria-label="Environment name 1"]','LANG');
    fill('[aria-label="Environment value 1"]','en');
    await wait(() => !el('#start-terminal').disabled,'valid input');
    await launch(1);
    assert(el('#terminal-launch[hidden] .cli-reference') && !el('.terminal-frame .cli-reference')
      && !el('.action-column > .cli-reference'), 'active terminal is free of documentation panels');
    assert(JSON.stringify(sockets[0].request.cli)===JSON.stringify({node:profile.id,method:'inspect',input:{args:['valid'],env:{LANG:'en'}}}),'CLI frame');
    sockets[0].emit({started:true,program:'tool'});
    const first = active();
    await click('#new-terminal');
    await launch(2);
    assert(JSON.stringify(sockets[1].request.cli.input)==='{}','empty optional fields');
    const statusIcon = selection(2).querySelector('.terminal-tab-dot');
    assert(statusIcon.getAnimations().length === 0, 'newly displayed status is static');
    sockets[1].emit({exitCode:5});
    await wait(() => selection(2)?.dataset.state === 'nonzero', 'nonzero exit');
    assert(statusIcon.getAnimations().length === (motion ? 1 : 0), 'status pulse respects motion preference');
    if (motion) {
      const [pulse] = statusIcon.getAnimations();
      assert(pulse.effect.getTiming().iterations === 2, 'exit pulse is noticeable and finite');
      pulse.finish();
      assert(statusIcon.getAnimations().length === 0, 'exit icon settles');
    }
    await click('[data-cli-method=report]');
    await wait(() => el('.cli-launch-context')?.textContent.includes('report'),'second action form');
    assert(!el('#terminal-command') && !el('.launch-environment') && !el('[data-terminal]'),'forbidden fields / scoped tabs');
    await launch(3);
    await click('#nav-terminal');
    await wait(() => all('[data-cli-group]').length===2,'global groups');
    const group = selector => all('[data-cli-group]').find(node=>node.getAttribute('aria-label').includes(selector));
    assert(group('inspect').dataset.state==='online' && group('report').dataset.state==='connecting','group status priority');
    assert(group('inspect').querySelector('.cli-group-star').textContent === '★','group status star');
    const members = group('inspect').closest('.cli-group').querySelector('.group-members');
    assert(members.parentElement.getBoundingClientRect().width === 0,'initially collapsed');
    group('inspect').click();
    if (motion) await checkWidthTransition(members.parentElement, members.getBoundingClientRect().width);
    await click('[data-terminal="1"]');
    assert(group('inspect').lastElementChild.textContent === 'inspect · Demo','expanded group label');
    assert(group('inspect').closest('.cli-group').querySelectorAll('[data-terminal]').length===2,'outlined group contains both tabs');
    await wait(() => active()===first,'same xterm across routes');
    group('inspect').click();
    await wait(() => all('[data-terminal]:not([inert] *)').length===0 && el('#new-terminal[aria-selected=true]'),'collapse selects launcher');
    if (motion) await checkWidthTransition(members.parentElement, members.getBoundingClientRect().width);
    assert(all('.terminal-frame:not([data-outside])').length===0 && !active(),'carousel excludes both collapsed groups');
    await wait(() => el('#terminal-command')?.value==='/bin/sh -i','global shell form');
    assert(el('#start-terminal').textContent === 'Start','shell submit label');
    await launch(4);
    assert(JSON.stringify(sockets[3].request.argv)==='["/bin/sh","-i"]' && !sockets[3].request.cli,'shell frame');
    group('inspect').click();
    await wait(() => selection(1) && active()===first,'remember child');
    await click('[data-close-terminal="1"]');
    assert(confirms===1 && sockets[0].readyState===1,'cancel individual close');
    group('inspect').click();
    await wait(() => group('inspect').getAttribute('aria-expanded')==='false', 'group collapsed');
    await click('[data-close-group]');
    assert(confirms===2 && sockets[0].readyState===1,'cancel group close');
    accept=true;
    await click('[data-close-group]');
    await wait(() => !group('inspect') && sockets[0].readyState===3,'group removed');
    assert(sockets.length===4 && all('#new-terminal').length===1 && sockets[2].readyState===1 && sockets[3].readyState===1,'unrelated sockets survived');
    await click('[data-node="profile-twin"]');
    await click('[data-cli-method=report]');
    await wait(() => el('.cli-launch-context')?.textContent.includes(twin.id),'second node');
    await launch(5);
    await click('#nav-terminal');
    await wait(() => all('[data-cli-group]').length===2,'same-name groups');
    const headers=all('[data-cli-group]');
    assert(headers.every(header=>header.getAttribute('aria-label')==='report · Demo'), 'method followed by node name');
    assert(new Set(headers.map(header=>header.dataset.cliGroup)).size===2,'distinct group identities');
    assert(selection(5) && !el('[data-terminal="3"]:not([inert] *)'),'only the selected group is expanded');
    await click('[data-terminal="4"]');
    headers.find(header=>header.getAttribute('aria-expanded')==='true').click();
    await wait(() => selection(4) && all('.terminal-frame:not([data-outside])').length===1,'collapsing another group preserves selection');
    const shellItem = selection(4).closest('.strip-item');
    const shellWidth = shellItem.getBoundingClientRect().width;
    const launcher = el('#new-terminal');
    const position = () => launcher.getBoundingClientRect().left + launcher.parentElement.scrollLeft;
    const beforeClose = position();
    await click('[data-close-terminal="4"]');
    assert(sockets[3].readyState === 3, 'closing disconnects immediately');
    if (motion) {
      await checkWidthTransition(shellItem, shellWidth);
    } else assert(shellItem.getBoundingClientRect().width === 0, 'immediate removal with reduced motion');
    await wait(() => !shellItem.isConnected,'exit complete');
    assert(position() < beforeClose, 'next tab occupies the released space');
    await wait(() => el('#new-terminal[aria-selected=true]'),'closing shell skips collapsed groups');
    const originalEntry = history.state.key;
    headers.find(header => JSON.parse(header.dataset.cliGroup)[0] === twin.id).click();
    await wait(() => selection(5), 'select a grouped terminal in the original entry');
    await click('[data-node="profile-twin"]');
    await wait(() => location.pathname === '/nodes/profile-twin' && el('#node-id')?.textContent === twin.id, 'navigate to the node');
    await click('#nav-terminal');
    await wait(() => selection(5) && history.state.key !== originalEntry, 'new terminal entry');
    const nextEntry = history.state.key;
    await click('#new-terminal');
    history.go(-2);
    await wait(() => history.state.key === originalEntry && selection(5)?.closest('.cli-group').dataset.expanded === 'true',
      'Back restores the selected terminal and its group');
    history.go(2);
    await wait(() => history.state.key === nextEntry && el('#new-terminal[aria-selected=true]'), 'Forward restores the launch form');
    await click('[data-close-terminal="5"]');
    await wait(() => !el('[data-terminal="5"]'), 'remove the terminal saved by the older entry');
    history.go(-2);
    await wait(() => history.state.key === originalEntry && history.state.pappaiView.terminal.id === null &&
      el('#new-terminal[aria-selected=true]'), 'an entry whose terminal was removed restores the launch form');
    assert(sockets.length === 5, 'history navigation preserved existing PTYs');
    document.querySelector('output').textContent='pass';
  } catch(error) {document.querySelector('output').textContent=error.stack;}
  finally {await nativeFetch('/test-finished');}
</script>
